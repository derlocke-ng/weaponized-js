<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gunfile</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --border: #2a2a2a;
  --text: #d4d4d4;
  --dim: #555;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --blue: #60a5fa;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem 1rem;
}

#app { width: 100%; max-width: 560px; }

h1 { font-size: 1.4rem; color: var(--green); letter-spacing: 0.15em; margin-bottom: 0.2rem; }
.subtitle { color: var(--dim); font-size: 0.8rem; margin-bottom: 1.75rem; }

.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
.tab {
  background: none; border: none; color: var(--dim); cursor: pointer;
  font-family: inherit; font-size: 0.9rem; padding: 0.5rem 1.1rem;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 0.15s;
}
.tab.active { color: var(--green); border-bottom-color: var(--green); }
.tab:hover:not(.active) { color: var(--text); }

.panel { display: none; }
.panel.active { display: block; }

/* drop zone */
.drop-zone {
  border: 1px dashed var(--border); border-radius: 4px; padding: 2.25rem;
  text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s;
  margin-bottom: 1rem; color: var(--dim);
}
.drop-zone:hover, .drop-zone.over {
  border-color: var(--green); background: rgba(74,222,128,0.03); color: var(--text);
}
.drop-zone label { color: var(--green); cursor: pointer; text-decoration: underline; }

/* file info */
.file-info {
  display: none; padding: 0.65rem 0.85rem; background: var(--surface);
  border: 1px solid var(--border); border-radius: 4px; margin-bottom: 0.85rem;
  font-size: 0.82rem; gap: 0.5rem;
}
.file-info.show { display: flex; justify-content: space-between; align-items: center; }
.file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-size { color: var(--dim); white-space: nowrap; }

/* warning */
.warning { color: var(--yellow); font-size: 0.78rem; margin-bottom: 0.75rem; display: none; }
.warning.show { display: block; }

/* primary button */
.btn-primary {
  background: var(--green); border: none; border-radius: 4px; color: #000;
  cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: bold;
  padding: 0.65rem 1.2rem; width: 100%; transition: opacity 0.15s;
}
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-primary:not(:disabled):hover { opacity: 0.85; }

/* progress */
.progress { display: none; margin-top: 1rem; }
.progress.show { display: block; }
.progress-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; height: 4px; overflow: hidden; margin-bottom: 0.45rem; }
.progress-fill { background: var(--green); height: 100%; width: 0%; transition: width 0.25s; }
.progress-meta { display: flex; justify-content: space-between; }
.status-txt { color: var(--dim); font-size: 0.78rem; }
.speed-txt  { color: var(--green); font-size: 0.78rem; font-variant-numeric: tabular-nums; }

/* result */
.result { display: none; margin-top: 1.5rem; }
.result.show { display: block; }
.result-label { color: var(--dim); font-size: 0.75rem; margin-bottom: 0.35rem; }
.code-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: stretch; }
.code-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  color: var(--blue); flex: 1; font-family: inherit; font-size: 0.78rem;
  padding: 0.6rem 0.75rem; white-space: nowrap; overflow-x: auto;
}
.btn-copy {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  color: var(--dim); cursor: pointer; font-family: inherit; font-size: 0.78rem;
  padding: 0.4rem 0.75rem; transition: color 0.15s, border-color 0.15s; white-space: nowrap;
}
.btn-copy:hover { color: var(--text); border-color: var(--dim); }
.btn-copy.copied { color: var(--green); border-color: var(--green); }

/* download panel */
.code-input {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: inherit; font-size: 0.88rem;
  padding: 0.65rem 0.75rem; width: 100%; margin-bottom: 0.85rem;
  outline: none; transition: border-color 0.15s;
}
.code-input:focus { border-color: var(--green); }
.code-input::placeholder { color: var(--dim); }

/* error */
.error { color: var(--red); font-size: 0.82rem; margin-top: 0.75rem; }

/* footer */
.footer {
  color: var(--dim); font-size: 0.72rem; margin-top: 2rem;
  padding-top: 1rem; border-top: 1px solid var(--border);
}
</style>
</head>
<body>
<div id="app">
  <h1>gunfile</h1>
  <p class="subtitle">encrypted p2p file sharing · no server · no account · files expire when peers forget</p>

  <div class="tabs">
    <button class="tab active" data-tab="upload">upload</button>
    <button class="tab" data-tab="download">download</button>
  </div>

  <!-- Upload -->
  <div id="panel-upload" class="panel active">
    <div id="drop-zone" class="drop-zone">
      <p>drop file here or <label for="file-input">browse</label></p>
      <input type="file" id="file-input" hidden>
    </div>
    <div id="file-info" class="file-info">
      <span id="file-name" class="file-name"></span>
      <span id="file-size" class="file-size"></span>
    </div>
    <div id="file-warning" class="warning"></div>
    <button id="btn-share" class="btn-primary" disabled>encrypt &amp; share</button>
    <div id="upload-progress" class="progress">
      <div class="progress-bar"><div id="upload-fill" class="progress-fill"></div></div>
      <div class="progress-meta">
        <span id="upload-status" class="status-txt"></span>
        <span id="upload-speed"  class="speed-txt"></span>
      </div>
    </div>
    <div id="upload-result" class="result">
      <div class="result-label">code (paste on download tab):</div>
      <div class="code-row">
        <div id="result-code" class="code-box"></div>
        <button class="btn-copy" data-target="result-code">copy</button>
      </div>
      <div class="result-label">shareable link:</div>
      <div class="code-row">
        <div id="result-link" class="code-box"></div>
        <button class="btn-copy" data-target="result-link">copy</button>
      </div>
    </div>
    <div id="upload-error" class="error"></div>
  </div>

  <!-- Download -->
  <div id="panel-download" class="panel">
    <input class="code-input" id="code-input" type="text" placeholder="paste code or full link here" autocomplete="off" spellcheck="false">
    <button id="btn-download" class="btn-primary">download</button>
    <div id="download-progress" class="progress">
      <div class="progress-bar"><div id="download-fill" class="progress-fill"></div></div>
      <div class="progress-meta">
        <span id="download-status" class="status-txt"></span>
        <span id="download-speed"  class="speed-txt"></span>
      </div>
    </div>
    <div id="download-error" class="error"></div>
  </div>

  <div class="footer" id="footer">connecting to gun peers…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script>
'use strict';

// ── config ────────────────────────────────────────────────────────────────────
const PEERS = [
  'https://relay.peer.ooo/gun',
  'https://gun.defucc.me/gun',
  'https://gun.o8.is/gun',
];
const NS         = 'gf2_';   // namespace to avoid collisions on public nodes
const CHUNK_SIZE = 65536;    // 64 KB binary per chunk before encryption
const WARN_SIZE  = 100 * 1024 * 1024; // 100 MB

// ── gun ───────────────────────────────────────────────────────────────────────
const gun = Gun({ peers: PEERS, localStorage: false });
document.getElementById('footer').textContent =
  'gun peers: ' + PEERS.map(p => new URL(p).hostname).join(', ');

// ── binary / base64 helpers ───────────────────────────────────────────────────
function u8ToB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 8192)
    s += String.fromCharCode(...u8.subarray(i, i + 8192));
  return btoa(s);
}

function b64ToU8(b64) {
  const s = atob(b64);
  const u8 = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
  return u8;
}

function fmtSize(n) {
  if (n < 1024)       return n + ' B';
  if (n < 1048576)    return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

// ── speedometer ───────────────────────────────────────────────────────────────
// Tracks bytes over a rolling window and exposes a formatted rate string.
class Speedometer {
  constructor(windowMs = 2000) {
    this._w = windowMs;
    this._samples = []; // [{t, bytes}]
  }
  add(bytes) {
    const now = Date.now();
    this._samples.push({ t: now, bytes });
    const cutoff = now - this._w;
    while (this._samples.length > 1 && this._samples[0].t < cutoff)
      this._samples.shift();
  }
  rate() {
    if (this._samples.length < 2) return '';
    const span = (this._samples.at(-1).t - this._samples[0].t) / 1000;
    if (span < 0.1) return '';
    const total = this._samples.slice(1).reduce((s, x) => s + x.bytes, 0);
    const bps = total / span;
    if (bps < 1024)        return bps.toFixed(0)        + ' B/s';
    if (bps < 1048576)     return (bps / 1024).toFixed(1)    + ' KB/s';
    return (bps / 1048576).toFixed(2) + ' MB/s';
  }
}

// ── concurrency pool ──────────────────────────────────────────────────────────
// Runs up to `limit` async tasks at once; queues the rest.
function pool(limit) {
  let active = 0;
  const queue = [];
  function kick() {
    if (active >= limit || !queue.length) return;
    active++;
    const { fn, resolve, reject } = queue.shift();
    fn().then(resolve, reject).finally(() => { active--; kick(); });
  }
  return fn => new Promise((resolve, reject) => { queue.push({ fn, resolve, reject }); kick(); });
}

const UPLOAD_LANES   = 8;
const DOWNLOAD_LANES = 8;

// ── gun helpers ───────────────────────────────────────────────────────────────
function gunPut(node, data) {
  return new Promise((resolve, reject) => {
    node.put(data, ack => ack.err ? reject(new Error(String(ack.err))) : resolve());
  });
}

// Waits for a non-null value at node, polling every second until timeout.
function gunWait(node, timeout = 30000) {
  return new Promise((resolve, reject) => {
    let done = false;
    const fail = setTimeout(() => {
      if (!done) { done = true; reject(new Error('timeout — data not found on peers')); }
    }, timeout);
    function tryOnce() {
      node.once(data => {
        if (done) return;
        if (data != null && data.v != null) {
          done = true;
          clearTimeout(fail);
          resolve(data);
        } else {
          setTimeout(tryOnce, 1000);
        }
      });
    }
    tryOnce();
  });
}

// ── crypto helpers ────────────────────────────────────────────────────────────
async function makeKey() {
  return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}

async function exportKey(key) {
  return u8ToB64(new Uint8Array(await crypto.subtle.exportKey('raw', key)));
}

async function importKey(b64) {
  return crypto.subtle.importKey('raw', b64ToU8(b64), { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

async function encrypt(key, iv, buf) {
  return new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, buf));
}

async function decrypt(key, iv, buf) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, buf));
}

function randId() {
  return u8ToB64(crypto.getRandomValues(new Uint8Array(6))).replace(/[+/=]/g, '').slice(0, 8);
}

// ── upload ────────────────────────────────────────────────────────────────────
async function uploadFile(file, onPct, onStatus, onSpeed) {
  onStatus('reading file…');
  const buf = await file.arrayBuffer();

  onStatus('encrypting…');
  const key  = await makeKey();
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const enc  = await encrypt(key, iv, buf);
  const b64k = await exportKey(key);

  const totalChunks = Math.ceil(enc.length / CHUNK_SIZE) || 1;
  const fileId = randId();

  onStatus('uploading metadata…');
  await gunPut(gun.get(NS + fileId + '_m'), { v: JSON.stringify({
    n: file.name,
    t: file.type || 'application/octet-stream',
    s: file.size,
    c: totalChunks,
    iv: u8ToB64(iv),
  }) });

  let uploaded = 0;
  const meter = new Speedometer();
  const run = pool(UPLOAD_LANES);
  await Promise.all(Array.from({ length: totalChunks }, (_, i) => run(async () => {
    const slice = enc.subarray(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
    await gunPut(gun.get(NS + fileId + '_c' + i), { v: u8ToB64(slice) });
    meter.add(slice.length);
    uploaded++;
    onPct(uploaded / totalChunks);
    onStatus(`uploading ${uploaded} / ${totalChunks} chunks…`);
    onSpeed(meter.rate());
  })));

  onSpeed('');
  return `${fileId}:${b64k}`;
}

// ── download ──────────────────────────────────────────────────────────────────
async function downloadFile(raw, onPct, onStatus, onSpeed) {
  // accept full URL or bare code
  if (raw.includes('#')) raw = raw.split('#').pop();
  raw = raw.trim();

  const sep = raw.indexOf(':');
  if (sep < 1) throw new Error('invalid code format');
  const fileId = raw.slice(0, sep);
  const b64k   = raw.slice(sep + 1);
  if (!fileId || !b64k) throw new Error('invalid code');

  onStatus('fetching metadata…');
  const metaObj = await gunWait(gun.get(NS + fileId + '_m'));
  let meta;
  try { meta = JSON.parse(metaObj.v); } catch { throw new Error('corrupt metadata'); }

  const key = await importKey(b64k);
  const iv  = b64ToU8(meta.iv);

  let loaded = 0;
  onStatus(`downloading 0 / ${meta.c} chunks…`);
  const dlMeter = new Speedometer();
  const fetch = pool(DOWNLOAD_LANES);

  const chunks = await Promise.all(
    Array.from({ length: meta.c }, (_, i) =>
      fetch(() => gunWait(gun.get(NS + fileId + '_c' + i))).then(obj => {
        const u8 = b64ToU8(obj.v);
        dlMeter.add(u8.length);
        loaded++;
        onPct(loaded / meta.c);
        onStatus(`downloading ${loaded} / ${meta.c} chunks…`);
        onSpeed(dlMeter.rate());
        return u8;
      })
    )
  );
  onSpeed('');

  onStatus('decrypting…');
  const totalLen = chunks.reduce((a, c) => a + c.length, 0);
  const combined = new Uint8Array(totalLen);
  let off = 0;
  for (const c of chunks) { combined.set(c, off); off += c.length; }

  const plain = await decrypt(key, iv, combined);

  onStatus('saving…');
  const blob = new Blob([plain], { type: meta.t });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: meta.n });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  onStatus(`done — ${meta.n} (${fmtSize(meta.s)})`);
}

// ── ui ────────────────────────────────────────────────────────────────────────
let currentFile = null;

// tab switching
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// file selection
function selectFile(file) {
  currentFile = file;
  document.getElementById('file-name').textContent = file.name;
  document.getElementById('file-size').textContent = fmtSize(file.size);
  document.getElementById('file-info').classList.add('show');
  document.getElementById('btn-share').disabled = false;
  document.getElementById('upload-result').classList.remove('show');
  document.getElementById('upload-error').textContent = '';

  const warn = document.getElementById('file-warning');
  if (file.size > WARN_SIZE) {
    warn.textContent = `large file (${fmtSize(file.size)}) — upload will be slow over public peers`;
    warn.classList.add('show');
  } else {
    warn.classList.remove('show');
  }
}

document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) selectFile(e.target.files[0]);
});

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', ()  => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('over');
  if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
});
dz.addEventListener('click', e => {
  if (e.target.tagName !== 'LABEL' && e.target.tagName !== 'INPUT')
    document.getElementById('file-input').click();
});

// share button
document.getElementById('btn-share').addEventListener('click', async () => {
  if (!currentFile) return;
  const btn    = document.getElementById('btn-share');
  const prog   = document.getElementById('upload-progress');
  const fill   = document.getElementById('upload-fill');
  const status = document.getElementById('upload-status');
  const errEl  = document.getElementById('upload-error');

  btn.disabled = true;
  prog.classList.add('show');
  fill.style.width = '0%';
  errEl.textContent = '';
  document.getElementById('upload-result').classList.remove('show');

  const speed = document.getElementById('upload-speed');

  try {
    const code = await uploadFile(
      currentFile,
      pct => { fill.style.width = (pct * 100).toFixed(1) + '%'; },
      msg => { status.textContent = msg; },
      spd => { speed.textContent = spd; }
    );
    const link = location.href.split('#')[0] + '#' + code;
    document.getElementById('result-code').textContent = code;
    document.getElementById('result-link').textContent = link;
    document.getElementById('upload-result').classList.add('show');
    status.textContent = 'done!';
  } catch (e) {
    errEl.textContent = 'upload failed: ' + e.message;
    btn.disabled = false;
  }
});

// copy buttons
const copyTimers = {};
document.querySelectorAll('.btn-copy').forEach(btn => {
  btn.addEventListener('click', () => {
    const id   = btn.dataset.target;
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'copied!';
      btn.classList.add('copied');
      clearTimeout(copyTimers[id]);
      copyTimers[id] = setTimeout(() => {
        btn.textContent = 'copy';
        btn.classList.remove('copied');
      }, 2000);
    });
  });
});

// download button
document.getElementById('btn-download').addEventListener('click', async () => {
  const code = document.getElementById('code-input').value;
  if (!code.trim()) return;

  const btn    = document.getElementById('btn-download');
  const prog   = document.getElementById('download-progress');
  const fill   = document.getElementById('download-fill');
  const status = document.getElementById('download-status');
  const errEl  = document.getElementById('download-error');

  btn.disabled = true;
  prog.classList.add('show');
  fill.style.width = '0%';
  errEl.textContent = '';

  const speed = document.getElementById('download-speed');

  try {
    await downloadFile(
      code,
      pct => { fill.style.width = (pct * 100).toFixed(1) + '%'; },
      msg => { status.textContent = msg; },
      spd => { speed.textContent = spd; }
    );
  } catch (e) {
    errEl.textContent = 'download failed: ' + e.message;
  } finally {
    btn.disabled = false;
  }
});

// auto-open download tab if URL contains a code
const hash = location.hash.slice(1);
if (hash && hash.includes(':')) {
  document.querySelector('[data-tab="download"]').click();
  document.getElementById('code-input').value = hash;
}
</script>
</body>
</html>
